[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-security-firewall"
version = "0.3.0"
description = "Production-grade security firewall layer and local agent security gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Security Engineering Team" }]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0"
]

[tool.setuptools.packages.find]
include = ["firewall*", "gateway*"]
